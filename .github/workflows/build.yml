name: Build and test

# Every plug-in, both builds, from the same source: Jellyfin 10.11 (.NET 9) and Jellyfin 12 (.NET 10). Each runs the
# plug-in's tests and makes its zip (not published) with the versions of the newest release in its CHANGELOG.md.
# A plug-in is any folder with a build.yaml, so a new one is built and tested here without changing this file.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugins:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "list=$(python3 tools/manifest.py plugins)" >> "$GITHUB_OUTPUT"
      - name: manifest.json lists each plug-in once, with its own picture, an address and a checksum for each version
        run: python3 tools/manifest.py check

  build:
    needs: plugins
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.plugins.outputs.list) }}
        jellyfin: ["10.11", "12"]
        include:
          - jellyfin: "10.11"
            dotnet: "9.0.x"
          - jellyfin: "12"
            dotnet: "10.0.x"
    name: ${{ matrix.plugin }} for Jellyfin ${{ matrix.jellyfin }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - name: Tests
        working-directory: ${{ matrix.plugin }}
        run: |
          project="$(python3 ../tools/manifest.py "${{ matrix.plugin }}" project)"
          dotnet test "tests/${project}.Tests" -c Release -p:JellyfinTarget=${{ matrix.jellyfin }}
      - name: Release zip and checksum (not published)
        run: |
          for v in $(python3 tools/manifest.py "${{ matrix.plugin }}" pair); do
            if [ "$(python3 tools/manifest.py "${{ matrix.plugin }}" target "$v")" = "${{ matrix.jellyfin }}" ]; then
              LOCAL=1 tools/package.sh "${{ matrix.plugin }}" "$v"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plugin }}-jellyfin-${{ matrix.jellyfin }}
          path: artifacts/${{ matrix.plugin }}_*.zip*
