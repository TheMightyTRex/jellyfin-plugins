name: Release

# The one step to publish a version: push its tag, such as v1.1.0.0. This builds and tests it, makes the release zip
# and its checksum, creates the GitHub release with the zip, and adds the version to manifest.json on main, so every
# Jellyfin with this repository sees the update.

on:
  push:
    tags: ["v*.*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Build the tagged commit
        run: git checkout "${GITHUB_REF_NAME}"
      - name: Unit tests
        run: dotnet test tests/Jellyfin.Plugin.PictureShrinker.Tests -c Release
      - name: Release zip and checksum
        id: zip
        run: |
          version="${GITHUB_REF_NAME#v}"
          LOCAL=1 tools/package.sh "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "checksum=$(cat artifacts/picture-shrinker_${version}.zip.md5)" >> "$GITHUB_OUTPUT"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.zip.outputs.version }}"
          python3 - "$v" > notes.md <<'PY'
          import re, sys
          v = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## {re.escape(v)}\b.*?$(.*?)(?=^## |\Z)", text, re.M | re.S)
          print(m.group(1).strip() if m else "")
          PY
          gh release create "${GITHUB_REF_NAME}" "artifacts/picture-shrinker_${v}.zip" --title "Picture shrinker ${v}" --notes-file notes.md
      - name: Add the version to manifest.json
        run: |
          v="${{ steps.zip.outputs.version }}"
          git checkout main
          python3 tools/manifest.py add "$v" "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/picture-shrinker_${v}.zip" "${{ steps.zip.outputs.checksum }}"
          git config user.name "TheMightyTRexUK"
          git config user.email "196487809+TheMightyTRex@users.noreply.github.com"
          git commit -am "manifest.json: Picture shrinker ${v}"
          git push origin main
