# For jprm (Jellyfin's plug-in packaging tool), if you prefer it to tools/package.sh: the same zip as the Jellyfin 12
# build. For the Jellyfin 10.11 build, use version 1.2.0.0, targetAbi "10.11.0.0" and framework "net9.0", and build
# with -p:JellyfinTarget=10.11.
name: "Picture shrinker"
guid: "80bf9325-d299-4e24-ac74-c087aeec3011"
version: "1.2.1.0"
targetAbi: "12.0.0.0"
framework: "net10.0"
owner: "TheMightyTRexUK"
overview: "Shrinks the posters, backdrops, logos, photos of people and other pictures Jellyfin keeps, so they take less space."
description: >
  Posters to 900 pixels tall, backdrops to 1,920 wide, photos of cast and crew to 400 wide and the other picture
  types to their own sizes, on the schedule you choose. Each smaller
  copy is checked before it replaces the original, and you choose whether the originals are backed up first.
category: "General"
artifacts:
  - "Jellyfin.Plugin.PictureShrinker.dll"
changelog: >
  See CHANGELOG.md.
